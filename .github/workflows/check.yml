# Hodinová kontrola farských oznamov.
# Beží na predvolenej vetve; pri zmene obsahu commitne aktualizované
# public/data/*.json, čo spustí automatické nasadenie na Cloudflare Pages.
#
# Poznámky:
#  - GitHub môže naplánované behy posunúť o pár minút (zdieľaná fronta).
#  - Po 60 dňoch bez aktivity v repozitári GitHub cron automaticky vypne —
#    stačí ho znova povoliť v záložke Actions alebo urobiť ľubovoľný commit.

name: Kontrola farských oznamov

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kontrola-oznamov
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kontrola oznamov
        run: node scripts/check.mjs

      - name: Commit a push zmien
        run: |
          if [[ -n "$(git status --porcelain public/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Aktualizácia farských oznamov ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Žiadne zmeny na commit."
          fi
